<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b9bfc9"/>
    </marker>
  </defs>

  <!-- A: input -->
  <rect x="20" y="125" width="180" height="90" rx="12" fill="#ffffff" stroke="#e3e5ea" stroke-width="1.5"/>
  <text x="110" y="152" text-anchor="middle" font-size="14.5" font-weight="600" fill="#17181c">Paper link</text>
  <text x="110" y="172" text-anchor="middle" font-size="11.5" fill="#6d737c">arXiv · PDF · DOI</text>
  <text x="110" y="189" text-anchor="middle" font-size="11.5" fill="#6d737c">extract metadata + text</text>

  <!-- B: orchestrator (accent) -->
  <rect x="250" y="125" width="170" height="90" rx="12" fill="#eef1fe" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="335" y="152" text-anchor="middle" font-size="14.5" font-weight="600" fill="#3730a3">Orchestrator</text>
  <text x="335" y="172" text-anchor="middle" font-size="11.5" fill="#4f46e5">dependency-aware</text>
  <text x="335" y="189" text-anchor="middle" font-size="11.5" fill="#4f46e5">JSON task board</text>

  <!-- agents 2x2 -->
  <rect x="60" y="255" width="190" height="75" rx="12" fill="#ffffff" stroke="#e3e5ea" stroke-width="1.5"/>
  <text x="155" y="281" text-anchor="middle" font-size="13.5" font-weight="600" fill="#17181c">Researcher</text>
  <text x="155" y="300" text-anchor="middle" font-size="11" fill="#6d737c">deep reading</text>
  <text x="155" y="316" text-anchor="middle" font-size="10" fill="#8f96a5">tool: read · search</text>

  <rect x="290" y="255" width="190" height="75" rx="12" fill="#ffffff" stroke="#e3e5ea" stroke-width="1.5"/>
  <text x="385" y="281" text-anchor="middle" font-size="13.5" font-weight="600" fill="#17181c">Reader</text>
  <text x="385" y="300" text-anchor="middle" font-size="11" fill="#6d737c">claim extraction</text>
  <text x="385" y="316" text-anchor="middle" font-size="10" fill="#8f96a5">tool: quote verify</text>

  <rect x="520" y="255" width="190" height="75" rx="12" fill="#ffffff" stroke="#e3e5ea" stroke-width="1.5"/>
  <text x="615" y="281" text-anchor="middle" font-size="13.5" font-weight="600" fill="#17181c">Critic</text>
  <text x="615" y="300" text-anchor="middle" font-size="11" fill="#6d737c">adversarial review</text>
  <text x="615" y="316" text-anchor="middle" font-size="10" fill="#8f96a5">tool: rubric scoring</text>

  <rect x="750" y="255" width="190" height="75" rx="12" fill="#ffffff" stroke="#e3e5ea" stroke-width="1.5"/>
  <text x="845" y="281" text-anchor="middle" font-size="13.5" font-weight="600" fill="#17181c">Synthesizer</text>
  <text x="845" y="300" text-anchor="middle" font-size="11" fill="#6d737c">structured review</text>
  <text x="845" y="316" text-anchor="middle" font-size="10" fill="#8f96a5">tool: tables · cites</text>

  <!-- C: output -->
  <rect x="330" y="40" width="300" height="55" rx="12" fill="#ffffff" stroke="#e3e5ea" stroke-width="1.5"/>
  <text x="480" y="64" text-anchor="middle" font-size="14" font-weight="600" fill="#17181c">Structured review + verified quotes</text>
  <text x="480" y="83" text-anchor="middle" font-size="11" fill="#6d737c">web dashboard · table rendering · progress</text>

  <!-- arrows: orchestrator -> agents (bus) -->
  <line x1="335" y1="215" x2="335" y2="235" stroke="#b9bfc9" stroke-width="1.8"/>
  <line x1="155" y1="235" x2="845" y2="235" stroke="#b9bfc9" stroke-width="1.8"/>
  <line x1="155" y1="235" x2="155" y2="251" stroke="#b9bfc9" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="385" y1="235" x2="385" y2="251" stroke="#b9bfc9" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="615" y1="235" x2="615" y2="251" stroke="#b9bfc9" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="845" y1="235" x2="845" y2="251" stroke="#b9bfc9" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- arrows: input -> orchestrator, orchestrator -> output -->
  <line x1="200" y1="170" x2="246" y2="170" stroke="#b9bfc9" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="335" y1="125" x2="335" y2="99" stroke="#b9bfc9" stroke-width="1.8" marker-end="url(#arr)"/>
</svg>
