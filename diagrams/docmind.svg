<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b9bfc9"/>
    </marker>
  </defs>

  <!-- A: upload -->
  <rect x="20" y="105" width="190" height="90" rx="12" fill="#ffffff" stroke="#e3e5ea" stroke-width="1.5"/>
  <text x="115" y="135" text-anchor="middle" font-size="14.5" font-weight="600" fill="#17181c">Upload</text>
  <text x="115" y="155" text-anchor="middle" font-size="11.5" fill="#6d737c">PDF · JPG · PNG</text>
  <text x="115" y="172" text-anchor="middle" font-size="11.5" fill="#6d737c">single or batch</text>

  <!-- B: extraction (accent) -->
  <rect x="250" y="95" width="200" height="110" rx="12" fill="#eef1fe" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="350" y="124" text-anchor="middle" font-size="14.5" font-weight="600" fill="#3730a3">Qwen-VL extraction</text>
  <text x="350" y="146" text-anchor="middle" font-size="11.5" fill="#4f46e5">structured JSON</text>
  <text x="350" y="163" text-anchor="middle" font-size="11.5" fill="#4f46e5">+ per-field confidence</text>
  <text x="350" y="185" text-anchor="middle" font-size="10" letter-spacing="0.5" fill="#8f96a5">multimodal document understanding</text>

  <!-- C: audit rules -->
  <rect x="490" y="95" width="200" height="110" rx="12" fill="#ffffff" stroke="#e3e5ea" stroke-width="1.5"/>
  <text x="590" y="124" text-anchor="middle" font-size="14.5" font-weight="600" fill="#17181c">Rule audit engine</text>
  <text x="590" y="146" text-anchor="middle" font-size="11.5" fill="#6d737c">duplicate · arithmetic · tax-rate</text>
  <text x="590" y="163" text-anchor="middle" font-size="11.5" fill="#6d737c">QR cross-check · GB 32100</text>
  <text x="590" y="185" text-anchor="middle" font-size="10" letter-spacing="0.5" fill="#8f96a5">8 rules · severity + evidence</text>

  <!-- D: output -->
  <rect x="730" y="95" width="210" height="110" rx="12" fill="#ffffff" stroke="#e3e5ea" stroke-width="1.5"/>
  <text x="835" y="124" text-anchor="middle" font-size="14.5" font-weight="600" fill="#17181c">Dashboard + knowledge graph</text>
  <text x="835" y="146" text-anchor="middle" font-size="11.5" fill="#6d737c">findings · document relations</text>
  <text x="835" y="163" text-anchor="middle" font-size="11.5" fill="#6d737c">trend analysis · audit trail</text>
  <text x="835" y="185" text-anchor="middle" font-size="10" letter-spacing="0.5" fill="#8f96a5">React · TypeScript</text>

  <!-- arrows -->
  <line x1="210" y1="150" x2="246" y2="150" stroke="#b9bfc9" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="450" y1="150" x2="486" y2="150" stroke="#b9bfc9" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="690" y1="150" x2="726" y2="150" stroke="#b9bfc9" stroke-width="1.8" marker-end="url(#arr)"/>
</svg>
