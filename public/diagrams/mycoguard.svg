<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b9bfc9"/>
    </marker>
  </defs>

  <!-- A: input -->
  <rect x="20" y="130" width="170" height="80" rx="12" fill="#ffffff" stroke="#e3e5ea" stroke-width="1.5"/>
  <text x="105" y="157" text-anchor="middle" font-size="14.5" font-weight="600" fill="#17181c">Mushroom photo</text>
  <text x="105" y="177" text-anchor="middle" font-size="11.5" fill="#6d737c">traits to inspect</text>
  <text x="105" y="194" text-anchor="middle" font-size="11.5" fill="#6d737c">offline-first</text>

  <!-- B: vision proxy -->
  <rect x="250" y="40" width="210" height="80" rx="12" fill="#ffffff" stroke="#e3e5ea" stroke-width="1.5"/>
  <text x="355" y="66" text-anchor="middle" font-size="14" font-weight="600" fill="#17181c">Vision proxy · Qwen-VL</text>
  <text x="355" y="87" text-anchor="middle" font-size="11.5" fill="#6d737c">trait extraction from image</text>
  <text x="355" y="104" text-anchor="middle" font-size="11.5" fill="#6d737c">secret-safe key handling</text>

  <!-- C: rule engine -->
  <rect x="250" y="220" width="210" height="80" rx="12" fill="#ffffff" stroke="#e3e5ea" stroke-width="1.5"/>
  <text x="355" y="246" text-anchor="middle" font-size="14" font-weight="600" fill="#17181c">Offline rule engine</text>
  <text x="355" y="267" text-anchor="middle" font-size="11.5" fill="#6d737c">distilled RF rules · UCI 8124</text>
  <text x="355" y="284" text-anchor="middle" font-size="11.5" fill="#6d737c">100%-purity branches</text>

  <!-- D: fusion (accent) -->
  <rect x="520" y="130" width="200" height="90" rx="12" fill="#eef1fe" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="620" y="156" text-anchor="middle" font-size="14" font-weight="600" fill="#3730a3">Confidence fusion</text>
  <text x="620" y="176" text-anchor="middle" font-size="11.5" fill="#4f46e5">agree · partial · disagree</text>
  <text x="620" y="193" text-anchor="middle" font-size="11.5" fill="#4f46e5">calibrated uncertainty tiers</text>
  <text x="620" y="210" text-anchor="middle" font-size="10" letter-spacing="0.5" fill="#8f96a5">97% confidence ceiling</text>

  <!-- E: output -->
  <rect x="780" y="130" width="160" height="90" rx="12" fill="#ffffff" stroke="#e3e5ea" stroke-width="1.5"/>
  <text x="860" y="156" text-anchor="middle" font-size="13.5" font-weight="600" fill="#17181c">Verdict +</text>
  <text x="860" y="173" text-anchor="middle" font-size="13.5" font-weight="600" fill="#17181c">explanation</text>
  <text x="860" y="193" text-anchor="middle" font-size="11.5" fill="#6d737c">risk level · sources</text>
  <text x="860" y="210" text-anchor="middle" font-size="11.5" fill="#6d737c">medical disclaimer</text>

  <!-- arrows -->
  <line x1="190" y1="150" x2="246" y2="86" stroke="#b9bfc9" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="190" y1="190" x2="246" y2="254" stroke="#b9bfc9" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="460" y1="86" x2="516" y2="146" stroke="#b9bfc9" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="460" y1="254" x2="516" y2="194" stroke="#b9bfc9" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="720" y1="175" x2="776" y2="175" stroke="#b9bfc9" stroke-width="1.8" marker-end="url(#arr)"/>
</svg>
