<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b9bfc9"/>
    </marker>
  </defs>

  <!-- A: upload/parse -->
  <rect x="20" y="110" width="170" height="80" rx="12" fill="#ffffff" stroke="#e3e5ea" stroke-width="1.5"/>
  <text x="105" y="137" text-anchor="middle" font-size="14.5" font-weight="600" fill="#17181c">PDF upload</text>
  <text x="105" y="157" text-anchor="middle" font-size="11.5" fill="#6d737c">open textbooks</text>
  <text x="105" y="174" text-anchor="middle" font-size="11.5" fill="#6d737c">layout-aware parsing</text>

  <!-- B: chunking -->
  <rect x="230" y="110" width="150" height="80" rx="12" fill="#ffffff" stroke="#e3e5ea" stroke-width="1.5"/>
  <text x="305" y="137" text-anchor="middle" font-size="14.5" font-weight="600" fill="#17181c">Chunking</text>
  <text x="305" y="157" text-anchor="middle" font-size="11.5" fill="#6d737c">semantic splits</text>
  <text x="305" y="174" text-anchor="middle" font-size="11.5" fill="#6d737c">with metadata</text>

  <!-- C: dense index (accent) -->
  <rect x="430" y="45" width="190" height="85" rx="12" fill="#eef1fe" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="525" y="71" text-anchor="middle" font-size="14" font-weight="600" fill="#3730a3">Dense index</text>
  <text x="525" y="92" text-anchor="middle" font-size="11.5" fill="#4f46e5">BGE-M3 embeddings</text>
  <text x="525" y="109" text-anchor="middle" font-size="11.5" fill="#4f46e5">→ ChromaDB</text>

  <!-- D: lexical index -->
  <rect x="430" y="170" width="190" height="85" rx="12" fill="#ffffff" stroke="#e3e5ea" stroke-width="1.5"/>
  <text x="525" y="196" text-anchor="middle" font-size="14" font-weight="600" fill="#17181c">Lexical index</text>
  <text x="525" y="217" text-anchor="middle" font-size="11.5" fill="#6d737c">BM25</text>
  <text x="525" y="234" text-anchor="middle" font-size="11.5" fill="#6d737c">exact-term recall</text>

  <!-- E: hybrid retrieval -->
  <rect x="660" y="110" width="130" height="80" rx="12" fill="#ffffff" stroke="#e3e5ea" stroke-width="1.5"/>
  <text x="725" y="137" text-anchor="middle" font-size="13.5" font-weight="600" fill="#17181c">Hybrid</text>
  <text x="725" y="155" text-anchor="middle" font-size="13.5" font-weight="600" fill="#17181c">retrieval</text>
  <text x="725" y="174" text-anchor="middle" font-size="11" fill="#6d737c">dense + BM25</text>
  <text x="725" y="188" text-anchor="middle" font-size="10" fill="#8f96a5">rerank optional</text>

  <!-- F: generation -->
  <rect x="830" y="110" width="110" height="80" rx="12" fill="#ffffff" stroke="#e3e5ea" stroke-width="1.5"/>
  <text x="885" y="137" text-anchor="middle" font-size="14" font-weight="600" fill="#17181c">DeepSeek</text>
  <text x="885" y="157" text-anchor="middle" font-size="11.5" fill="#6d737c">answer</text>
  <text x="885" y="174" text-anchor="middle" font-size="11.5" fill="#6d737c">+ citations</text>

  <!-- arrows -->
  <line x1="190" y1="150" x2="226" y2="150" stroke="#b9bfc9" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="380" y1="130" x2="426" y2="94" stroke="#b9bfc9" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="380" y1="170" x2="426" y2="206" stroke="#b9bfc9" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="620" y1="94" x2="656" y2="130" stroke="#b9bfc9" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="620" y1="206" x2="656" y2="170" stroke="#b9bfc9" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="790" y1="150" x2="826" y2="150" stroke="#b9bfc9" stroke-width="1.8" marker-end="url(#arr)"/>
</svg>
